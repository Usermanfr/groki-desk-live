<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Desk</title>
<style>body{margin:0;font:14px -apple-system,system-ui;background:#0b0e14;color:#e6e6e6;max-width:430px}
nav{display:flex;position:sticky;top:0;background:#111}nav b{flex:1;padding:12px;text-align:center;cursor:pointer}nav b.on{color:#2ee6d6}
.card{background:#161b26;margin:10px;padding:12px;border-radius:12px}.k{color:#888}.r{color:#ff5470}.g{color:#3ddc84}.pill{padding:2px 8px;border-radius:9px;font-size:12px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222}.kill{color:#777;text-decoration:line-through #ff5470}
a{color:#2ee6d6}.err{color:#ff5470;padding:20px}.empty{color:#777;padding:20px;text-align:center}.t{color:#666;font-size:11px;white-space:nowrap}.badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;margin-left:6px}.badge.good{background:#143528;color:#3ddc84}.badge.watch{background:#3a2e14;color:#f0c14b}.badge.noise{background:#222;color:#888}
.setup{padding:20px}.setup input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #333;background:#0b0e14;color:#e6e6e6;margin:8px 0 12px}
.setup button{width:100%;padding:12px;border:0;border-radius:10px;background:#2ee6d6;color:#0b0e14;font-weight:700}</style></head><body>
<nav><b data-t="home" class="on">Home</b><b data-t="agents">Agents</b><b data-t="activity">Activity</b><b data-t="news">News</b><b data-t="account">Account</b></nav><main id="m"></main>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const h=new URLSearchParams((location.hash||'').replace(/^#/,''));
  const d=q.get('d')||h.get('d');
  const t=q.get('t')||h.get('t');
  try{
    if(d)localStorage.setItem('d',d);
    if(t)localStorage.setItem('t',t);
  }catch(e){}
  if(d||t||location.hash||location.search){
    try{history.replaceState(0,'',location.pathname+(location.pathname.endsWith('/')?'':'/'));}catch(e){}
  }
})();
let D=null;try{D=localStorage.getItem('d')}catch(e){}
let tab='home',S=null,A=[],E=null;
document.querySelectorAll('nav b').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav b').forEach(x=>x.classList.toggle('on',x==b));draw()});
const $=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const when=ts=>{if(!ts)return'';const d=new Date((ts>1e12?ts:ts*1000));if(isNaN(d))return'';const p=n=>String(n).padStart(2,'0');const now=new Date();const same=d.toDateString()===now.toDateString();return same?(p(d.getHours())+':'+p(d.getMinutes())):(p(d.getDate())+'.'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()));};
function saveKey(){
  const v=(document.getElementById('dk')||{}).value||'';
  const m=v.trim().match(/(?:[?&#]d=)?([A-Za-z0-9_-]{16,})/);
  if(!m){alert('Key fehlt oder zu kurz.');return}
  try{localStorage.setItem('d',m[1]);D=m[1];E=null;load()}catch(e){alert('Speichern blockiert (Privatmodus?). Chrome normal öffnen.')}
}
async function load(){
  if(!D){E='need-key';return draw()}
  try{
    S=await(await fetch('d/'+encodeURIComponent(D)+'/state.json?'+Date.now())).json();
    A=await(await fetch('d/'+encodeURIComponent(D)+'/activity.json?'+Date.now())).json();
    E=null
  }catch(e){E='Desk data unreachable. Retrying every 15s.'}
  draw()
}
function draw(){
  const m=document.getElementById('m');
  if(E==='need-key'){
    m.innerHTML='<div class="setup"><div class="err">Handy hat den Schlüssel nicht mitbekommen (häufig bei Samsung / In-App-Browser).</div><p class="k">Den kompletten Link nochmal in <b>Chrome</b> öffnen — oder den Teil nach <code>d=</code> hier einfügen:</p><input id="dk" placeholder="d=… oder kompletter Link" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button type="button" id="sk">Speichern &amp; laden</button></div>';
    const btn=document.getElementById('sk');if(btn)btn.onclick=saveKey;
    return;
  }
  if(E)return m.innerHTML='<div class="err">'+$(E)+'</div>';
  if(!S)return m.innerHTML='<div class="empty">Loading…</div>';
  const P=S.mode=='PAPER'?'PAPER · ':'';const st=S.settings;
  if(tab=='home'){
    const scans=(S.scans||[]).slice(0,25);
    m.innerHTML='<div class="card"><div class="k">'+P+'Stack</div><h1>$'+S.stack.toFixed(2)+'</h1><div class="k">free $'+S.balance.toFixed(2)+'</div></div>'+
     (S.positions.length?S.positions.map(p=>'<div class="card row"><a href="'+$(p.link)+'">'+$(p.name)+'</a><span>$'+p.size.toFixed(2)+' · stop -'+p.stop_pct+'%</span><a href="'+$(p.link)+'">Sell on FOMO</a></div>').join(''):'<div class="empty">No open positions</div>')+
     '<div class="card"><b>Scanned</b> · '+(S.counts&&S.counts.pools!=null?S.counts.pools:scans.length)+' pools'+
     (scans.length?scans.map(s=>{
       const href=$(s.link||S.signup_url);
       const right=s.verdict=='pass'?('liq $'+Math.round(s.liquidityUsd||0)+' · → auditor'):$(s.reason||'kill');
       return '<div class="row '+(s.verdict=='kill'?'kill':'')+'"><a href="'+href+'">'+$(s.name||s.mint.slice(0,6))+'</a><span>'+right+(s.ts||s.at?' <span class="t">'+when(s.ts||s.at)+'</span>':'')+'</span></div>';
     }).join(''):'<div class="k" style="padding:8px 0">Noch keine Scans</div>')+
     '</div>'+
     '<div class="card"><b>Callouts</b> · alle 50 Min · '+((S.counts&&S.counts.callouts_n)||0)+
     ((S.callouts||[]).length?(S.callouts||[]).slice(0,25).map(c=>{
       const who=c.url?'<a href="'+$(c.url)+'">@'+$(c.author||'?')+'</a>':'@'+$(c.author||'?');
       const coin=c.mint&&c.link?' · <a href="'+$(c.link)+'">FOMO</a>':'';
       const body=$((c.text||'').replace(/\s+/g,' ').slice(0,220));
       return '<div style="padding:10px 0;border-bottom:1px solid #222"><div class="row" style="border:0;padding:0"><span>'+who+coin+'</span><span class="t">'+when(c.ts)+'</span></div><div style="margin-top:6px;line-height:1.35">'+body+'</div></div>';
     }).join(''):'<div class="k" style="padding:8px 0">Noch keine Callouts</div>')+
     '</div>';
  }
  if(tab=='agents'){const c=S.counts;m.innerHTML='<div class="card"><b>Scanner</b> · '+c.pools+' pools'+(S.scans||[]).slice(0,25).map(s=>{const href=$(s.link||S.signup_url);return '<div class="row '+(s.verdict=='kill'?'kill':'')+'"><a href="'+href+'">'+$(s.name||s.mint.slice(0,6))+'</a><span>'+(s.verdict=='pass'?'liq $'+Math.round(s.liquidityUsd||0)+' · → auditor':$(s.reason))+'</span></div>'}).join('')+'</div>'+
'<div class="card"><b>Auditor</b> · '+c.audited+' taken apart · '+c.audit_rejected+' rejected'+S.audits.slice(0,5).map(a=>'<div class="row"><span>'+a.mint.slice(0,6)+'</span><span class="'+(a.passed?'g':'r')+'">'+(a.passed?'8/8 → Executor':$(a.reason))+'</span></div>').join('')+'</div>'+
'<div class="card"><b>Analyst</b> · Scoring · '+c.scored+' scored · '+st.analyst.mode+'</div><div class="card"><b>Executor</b> · '+c.trades+' trades · '+st.executor.stack_pct+'% of stack</div>'+
'<div class="card"><b>XWatch</b> · '+(c.callouts_n||0)+' callouts · '+(c.xnews_n||0)+' news · '+((S.heartbeats||{}).xwatch&&(Date.now()/1000-S.heartbeats.xwatch<120)?'listening':'idle')+'</div>'+
'<div class="card"><b>Risk</b> · '+(S.positions.length?'Guarding':'Idle')+' <span class="pill r">stop -'+st.risk.stop_pct+'%</span> <span class="pill g">trail '+st.risk.trail_pct+'%</span></div>'}
  if(tab=='activity')m.innerHTML=A.filter(a=>a.kind!='xnews'&&a.kind!='callout').length?A.filter(a=>a.kind!='xnews'&&a.kind!='callout').map(a=>{
    const title=(a.mode=='PAPER'?'PAPER · ':'')+(a.link?'<a href="'+$(a.link)+'">'+$(a.title)+'</a>':$(a.title));
    const body=$(a.sub||'');
    const tm=when(a.ts);
    return '<div class="card row'+(a.kind=='kill'?' kill':'')+'"><span>'+title+'<br><span class="k">'+body+(tm?' · '+tm:'')+'</span></span><span>'+$(a.right)+'</span></div>';
  }).join(''):'<div class="empty">No activity yet tonight</div>';
  if(tab=='news'){
    const news=(S.xnews||[]).slice();
    const usefulN=(S.counts&&S.counts.useful_n)||news.filter(n=>n.useful).length;
    const watch=(S.news_watch||[]).slice(0,8);
    m.innerHTML='<div class="card"><b>X News</b> · '+((S.counts&&S.counts.xnews_n)||news.length)+' · <span class="g">'+usefulN+' useful</span>'+
      '<div class="k" style="margin-top:6px">Sortiert: gut/watch zuerst. Useful fließt in Analyst-Kontext (kein Auto-Kauf).</div>'+
      (news.length?news.map(n=>{
        const v=n.verdict||'noise';
        const badge='<span class="badge '+v+'">'+$(v)+(n.useful?' · useful':'')+'</span>';
        const title=n.url?'<a href="'+$(n.url)+'">'+$(n.name||'News')+'</a>':$(n.name||'News');
        const body=$((n.hook||n.summary||n.text||'').replace(/\s+/g,' ').slice(0,280));
        const mint=n.mint&&n.link?' · <a href="'+$(n.link)+'">Mint</a>':'';
        return '<div style="padding:10px 0;border-bottom:1px solid #222"><div class="row" style="border:0;padding:0"><span>'+title+badge+mint+'</span><span class="t">'+when(n.ts)+'</span></div><div class="k" style="margin-top:6px;line-height:1.35">'+body+'</div></div>';
      }).join(''):'<div class="k" style="padding:8px 0">Noch keine News</div>')+
      '</div>'+
      (watch.length?'<div class="card"><b>Watch (News gut, noch kein Entry)</b>'+watch.map(w=>{
        return '<div class="row"><span>'+$(w.name|| (w.mint||'').slice(0,6))+'<br><span class="k">'+$((w.news&&w.news.title)||'')+' · score '+(w.score||'?')+'</span></span><span class="pill">Watch</span></div>';
      }).join('')+'</div>':'')+
      '<div class="card"><b>Callouts</b> · '+((S.counts&&S.counts.callouts_n)||0)+
      ((S.callouts||[]).length?(S.callouts||[]).slice(0,40).map(c=>{
        const who=c.url?'<a href="'+$(c.url)+'">@'+$(c.author||'?')+'</a>':'@'+$(c.author||'?');
        const coin=c.mint&&c.link?' · <a href="'+$(c.link)+'">FOMO</a>':'';
        const body=$((c.text||'').replace(/\s+/g,' ').slice(0,280));
        return '<div style="padding:10px 0;border-bottom:1px solid #222"><div class="row" style="border:0;padding:0"><span>'+who+coin+'</span><span class="t">'+when(c.ts)+'</span></div><div style="margin-top:6px;line-height:1.35">'+body+'</div></div>';
      }).join(''):'<div class="k" style="padding:8px 0">Noch keine Callouts</div>')+
      '</div>';
  }
  if(tab=='account')m.innerHTML='<div class="card">Mode '+S.mode+' · FOMO @'+$(st.desk.fomo_handle)+'<br>Notifier: Discord. Web push is not available on this hosting (Plan B).<br>Settings are read-only here; change them on Discord/Grok Bot: <i>set stop to -8%</i><br><a href="'+$(S.signup_url)+'">Invite: '+$(S.signup_url)+'</a></div>'+
 Object.entries(st).map(([g,o])=>'<div class="card"><b>'+g+'</b>'+Object.entries(o).map(([k,v])=>'<div class="row"><span class="k">'+k+'</span><span>'+$(v)+'</span></div>').join('')+'</div>').join('')
}

/* Trade sounds — Web Audio, no files. Unlock on first tap (iOS). */
let AC=null, soundOn=false, lastActId=null, primed=false;
try{lastActId=parseInt(localStorage.getItem('lastActId')||'0',10)||0}catch(e){lastActId=0}
function ensureAC(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; AC=new C()}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(freq, t0, dur, type, gain, slide){
  const ac=ensureAC(); if(!ac)return;
  const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), t0+dur);
  f.type='lowpass'; f.frequency.value=4200;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain||0.18, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(f); f.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
function sparkle(t0){
  const ac=ensureAC(); if(!ac)return;
  const n=ac.createBufferSource(), buf=ac.createBuffer(1, ac.sampleRate*0.12, ac.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const g=ac.createGain(), f=ac.createBiquadFilter();
  f.type='highpass'; f.frequency.value=1800;
  g.gain.setValueAtTime(0.08, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.12);
  n.buffer=buf; n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t0); n.stop(t0+0.13);
}
function playBuy(){
  const ac=ensureAC(); if(!ac||!soundOn)return;
  const t=ac.currentTime+0.02;
  // bright ascending power-up
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f, t+i*0.07, 0.28, i%2?'triangle':'sine', 0.16));
  tone(1318.5, t+0.32, 0.45, 'sine', 0.1);
  sparkle(t+0.28);
}
function playSell(){
  const ac=ensureAC(); if(!ac||!soundOn)return;
  const t=ac.currentTime+0.02;
  // cash-out: quick down-blip then fat resolved chord
  tone(880, t, 0.12, 'square', 0.07, 440);
  tone(660, t+0.1, 0.14, 'square', 0.06, 330);
  [392,493.88,587.33,784].forEach((f,i)=>tone(f, t+0.28+i*0.05, 0.4, 'triangle', 0.14));
  tone(196, t+0.3, 0.5, 'sine', 0.12);
  sparkle(t+0.45);
}
function unlockSound(){
  const ac=ensureAC(); if(!ac)return;
  soundOn=true;
  try{localStorage.setItem('soundOn','1')}catch(e){}
  // silent tick so iOS stays unlocked
  tone(440, ac.currentTime, 0.01, 'sine', 0.0001);
}
try{if(localStorage.getItem('soundOn')==='1')soundOn=true}catch(e){}
['pointerdown','touchstart','click'].forEach(ev=>document.addEventListener(ev,()=>{if(!primed){primed=true;unlockSound()}},{once:true,passive:true}));

function watchTrades(){
  if(!A||!A.length)return;
  const maxId=Math.max(...A.map(a=>a.id||0));
  if(!lastActId){ // first load: arm, don't replay history
    lastActId=maxId;
    try{localStorage.setItem('lastActId',String(lastActId))}catch(e){}
    return;
  }
  if(maxId<=lastActId)return;
  const fresh=A.filter(a=>(a.id||0)>lastActId).sort((a,b)=>a.id-b.id);
  for(const a of fresh){
    if(a.kind==='buy') playBuy();
    else if(a.kind==='sell'||a.kind==='stop') playSell();
  }
  lastActId=maxId;
  try{localStorage.setItem('lastActId',String(lastActId))}catch(e){}
}

const _load=load;
load=async function(){
  await _load();
  watchTrades();
};

// Account: sound test buttons
const _draw=draw;
draw=function(){
  _draw();
  if(tab==='account' && S && !E){
    const m=document.getElementById('m');
    const box=document.createElement('div');
    box.className='card';
    box.innerHTML='<b>Sounds</b><div class="k" style="margin:6px 0 10px">Cooler Ping bei Buy &amp; Sell. Tippe einmal irgendwo, dann sind Sounds an.</div>'+
      '<div style="display:flex;gap:8px"><button type="button" id="tb" style="flex:1;padding:10px;border:0;border-radius:10px;background:#3ddc84;color:#0b0e14;font-weight:700">Buy test</button>'+
      '<button type="button" id="ts" style="flex:1;padding:10px;border:0;border-radius:10px;background:#ff5470;color:#0b0e14;font-weight:700">Sell test</button></div>';
    m.appendChild(box);
    const on=()=>{unlockSound();};
    document.getElementById('tb').onclick=()=>{on();playBuy()};
    document.getElementById('ts').onclick=()=>{on();playSell()};
  }
};

load();setInterval(load,15000);

</script></body></html>
